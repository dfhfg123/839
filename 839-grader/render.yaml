services:
  - type: web
    name: 839-grader
    runtime: node
    plan: free
    rootDir: 839-grader
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: SILICONFLOW_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
